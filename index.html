<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Escena isométrica interactiva de un edificio de dos torres.">
    <title>IsometriCode</title>
    <link rel="preload" href="/fuentes/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fuentes/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/src/estilos/base.css">
    <link rel="stylesheet" href="/src/estilos/menu.css">
    <link rel="stylesheet" href="/src/estilos/panel.css">
    <link rel="stylesheet" href="/src/estilos/zoom.css">
  </head>
  <body>
    <h1 class="solo-lector">IsometriCode · Edificio de prueba</h1>

    <!-- Menú lateral -->
    <nav class="menu" aria-label="Menú principal">
      <a class="menu__logo" href="./" aria-label="Inicio de prueba">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 27V9l7-4v22M18 27V12l7 3v12M4 27h24"/></svg>
      </a>
      <ul class="menu__lista" id="menu-lista"></ul>

      <!-- Día / Tarde -->
      <button class="menu__boton menu__ambiente" id="boton-ambiente" type="button" aria-label="Cambiar a tarde" aria-pressed="false">
        <svg class="menu__icono-dia" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="menu__icono-tarde" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 18a5 5 0 0 0-10 0M12 9V3M8.5 6.5 12 3l3.5 3.5M3 18h18M6 21h12M4.2 12.2l1.4 1.4M18.4 13.6l1.4-1.4"/></svg>
        <span class="menu__etiqueta" id="etiqueta-ambiente" aria-hidden="true">Tarde</span>
      </button>
    </nav>

    <!-- Escena 3D -->
    <main class="escena" id="escena" aria-label="Vista isométrica del edificio. Arrastra para girar, rueda para acercar.">
      <canvas id="lienzo"></canvas>
    </main>

    <!-- Control de zoom: la mitad de la barra es el zoom predeterminado -->
    <div class="zoom" role="group" aria-label="Zoom">
      <button class="zoom__boton" id="zoom-menos" type="button" aria-label="Alejar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
      <input class="zoom__barra" id="zoom-barra" type="range" min="0" max="100" step="1" value="50" aria-label="Nivel de zoom">
      <button class="zoom__boton" id="zoom-mas" type="button" aria-label="Acercar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg>
      </button>
    </div>

    <!-- Fundido entre vistas -->
    <div class="fundido" id="fundido" aria-hidden="true"></div>

    <!-- Etiqueta del cursor -->
    <div class="etiqueta" id="etiqueta" aria-hidden="true"></div>

    <!-- Panel del elemento seleccionado -->
    <dialog class="panel" id="panel" popover="manual" aria-labelledby="panel-titulo">
      <header class="panel__cabecera">
        <p class="panel__tipo" id="panel-tipo"></p>
        <h2 class="panel__titulo" id="panel-titulo"></h2>
        <p class="panel__id" id="panel-id"></p>
        <button class="panel__cerrar" id="panel-cerrar" type="button" aria-label="Cerrar panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <dl class="panel__datos" id="panel-datos"></dl>
      <p class="panel__nota" id="panel-nota" hidden></p>
      <div class="panel__botones" id="panel-botones"></div>
    </dialog>

    <!-- Aviso breve -->
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
